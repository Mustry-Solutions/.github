name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of this project you are using.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relevant environment details, e.g. Ignition version, OS, Docker or bare metal.
      placeholder: Ignition 8.3.1, Docker on Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. This is automatically formatted as code.
      render: shell
